apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-dep
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      imagePullSecrets:
      - name: dockercred
      containers:
      - name: sample-app
        image: mustakkhan-dev.jfrog.io/mustak-docker-local/sample_app:2.1.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: MAINTAINER
          value: "Mustak Khan"
